<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một câu hỏi nhỏ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  color: #252a31;
  background: #f4f5f7;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 42px 36px 36px;
  background: #ffffff;
  border: 1px solid #e8eaee;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(25, 35, 50, 0.045);
}

.heading {
  margin: 0 0 34px;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.6px;
  line-height: 1.4;
}

.description {
  margin: -22px 0 30px;
  color: #858b95;
  font-size: 14px;
  line-height: 1.7;
}

label {
  display: block;
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 600;
}

.hint {
  margin: 0 0 12px;
  color: #858b95;
  font-size: 13px;
  line-height: 1.7;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 50px;
  padding: 0 15px;
  border: 1px solid #dfe3e8;
  border-radius: 6px;
  background: #fafbfc;
  color: #252a31;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

input::placeholder {
  color: #a5aab2;
}

input:focus {
  border-color: #697b90;
  background: #ffffff;
}

button {
  width: 100%;
  height: 49px;
  margin-top: 14px;
  border: 1px solid #303b49;
  border-radius: 6px;
  background: #303b49;
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #202a36;
}

button:active {
  transform: translateY(1px);
}

#result {
  margin-top: 22px;
  color: #555f6c;
  font-size: 14px;
  line-height: 1.7;
  text-align: center;
}

.hidden {
  display: none !important;
}

/* Màn hình lời nhắn */
#messageScreen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: #ffffff;
  color: #30343b;
  text-align: center;
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

#messageScreen.show {
  visibility: visible;
  opacity: 1;
}

.message-line {
  max-width: 650px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(23px, 5vw, 32px);
  line-height: 1.8;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 1s ease, transform 1s ease;
}

.message-line.show {
  opacity: 1;
  transform: translateY(0);
}

#secondLine {
  margin-top: 22px;
  font-size: clamp(21px, 4.5vw, 28px);
}

@media (max-width: 480px) {
  .card {
    padding: 32px 24px 28px;
  }

  .heading {
    font-size: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>

</head>

<body>

<main class="card" id="mainCard">
  <h1 class="heading">Đón nhận sự bất ngờ sau khi nhập tên</h1>

  <p class="description">
    Đôi khi, một cái tên cũng đủ để mở ra điều thú vị.
  </p>

  <form id="nameForm">
    <label for="name">Họ và tên</label>

```
<p class="hint">
  Viết hoa chữ cái đầu mỗi từ. Ví dụ: Nguyễn Bỉnh Khiêm
</p>

<div class="input-wrap">
  <input
    id="name"
    type="text"
    placeholder="Nhập họ và tên của bạn"
    autocomplete="off"
    required
  >
</div>

<button type="submit">Tiếp tục</button>
```

  </form>

  <div id="result" aria-live="polite"></div>
</main>

<section id="messageScreen" aria-live="polite">
  <div class="message-line" id="firstLine">
    Xem ra người đặc biệt nay đã xuất hiện rồi.
  </div>

  <div class="message-line" id="secondLine">
    Tớ chờ bạn mãi, Phương Thanh ạ.
  </div>
</section>

<script>
let locked = false;

function normalizeName(value) {
  return value
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

document.getElementById("nameForm").addEventListener("submit", function(event) {
  event.preventDefault();

  if (locked) return;

  const name = normalizeName(document.getElementById("name").value);
  const words = name.split(" ");
  const target = ["nguyen", "thi", "phuong", "thanh"];

  const isThanh =
    words.length === 4 &&
    target.every(word => words.includes(word));

  const result = document.getElementById("result");

  if (!isThanh) {
    result.textContent = "Có vẻ bạn chưa phải nhân vật chính của hôm nay.";
    return;
  }

  locked = true;

  document.getElementById("mainCard").classList.add("hidden");

  const screen = document.getElementById("messageScreen");
  const firstLine = document.getElementById("firstLine");
  const secondLine = document.getElementById("secondLine");

  screen.classList.add("show");

  setTimeout(() => {
    firstLine.classList.add("show");
  }, 400);

  setTimeout(() => {
    secondLine.classList.add("show");
  }, 2300);
});
</script>

</body>
</html>
