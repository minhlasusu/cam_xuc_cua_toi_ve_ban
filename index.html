<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một câu hỏi nhỏ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  color: #303844;
  background: linear-gradient(135deg, #edf1f5, #dfe6ed);
  transition: background 1.5s ease;
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 34px 30px 30px;
  background: #ffffff;
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 14px;
  box-shadow: 0 12px 35px rgba(40,55,75,0.08);
}

.heading {
  margin: 0 0 30px;
  text-align: center;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.4px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 600;
}

.hint {
  margin: 0 0 13px;
  color: #818995;
  font-size: 12.5px;
  line-height: 1.6;
}

input {
  display: block;
  width: 100%;
  height: 46px;
  padding: 0 13px;
  border: 1px solid #d8dee6;
  border-radius: 7px;
  outline: none;
  background: #fcfcfd;
  color: #303844;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
  color: #a5acb5;
}

input:focus {
  border-color: #71869c;
  box-shadow: 0 0 0 3px rgba(113,134,156,0.10);
  background: #ffffff;
}

button {
  display: block;
  width: 100%;
  height: 45px;
  margin-top: 16px;
  border: none;
  border-radius: 7px;
  background: #394b60;
  color: white;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

button:hover {
  background: #29394c;
}

button:active {
  transform: scale(0.99);
}

#result {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.7;
  color: #596574;
}

body.special {
  background: #eee7dc;
}

body.special .card {
  background: #fffdf8;
}

#darkScreen {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #17191e;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

#darkScreen.active {
  opacity: 1;
}

#specialMessage {
  position: fixed;
  inset: 0;
  z-index: 11;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
  color: #f7f1e8;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease, color 1.5s ease;
}

#specialMessage.visible {
  opacity: 1;
}

#specialMessage.warm {
  color: #514638;
}

#firstLine {
  max-width: 600px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(24px, 5vw, 32px);
  line-height: 1.6;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

#specialMessage.visible #firstLine {
  opacity: 1;
  transform: translateY(0);
}

#secondLine {
  max-width: 600px;
  margin-top: 25px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(21px, 4.5vw, 27px);
  line-height: 1.8;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1s ease, transform 1s ease;
}

#secondLine.visible {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 480px) {
  .card {
    padding: 30px 23px 25px;
  }

  .heading {
    font-size: 21px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>

</head>

<body>

<div class="card" id="mainCard">
  <h2 class="heading">Đón nhận sự bất ngờ sau khi nhập tên</h2>

  <form onsubmit="checkName(event)">
    <label for="name">Họ và tên</label>

```
<p class="hint">
  Viết hoa chữ cái đầu mỗi từ, VD: Nguyễn Bỉnh Khiêm
</p>

<input
  id="name"
  type="text"
  placeholder="Nhập họ và tên của bạn"
  autocomplete="off"
  required
>

<button type="submit">Xác nhận</button>
```

  </form>

  <div id="result" aria-live="polite"></div>
</div>

<div id="darkScreen"></div>

<div id="specialMessage" aria-live="polite">
  <div id="firstLine">
    Xem ra người đặc biệt nay đã xuất hiện rồi.
  </div>

  <div id="secondLine">
    Tớ chờ bạn mãi, Phương Thanh ạ.
  </div>
</div>

<script>
let locked = false;

function normalizeName(value) {
  return value
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function checkName(event) {
  event.preventDefault();

  if (locked) return;

  const input = document.getElementById("name").value;
  const name = normalizeName(input);

  const words = name.split(" ");
  const target = ["nguyen", "thi", "phuong", "thanh"];

  const isThanh =
    words.length === 4 &&
    target.every(word => words.includes(word));

  const result = document.getElementById("result");

  if (!isThanh) {
    result.textContent =
      "Có vẻ bạn chưa phải nhân vật chính của hôm nay.";
    return;
  }

  locked = true;

  const darkScreen = document.getElementById("darkScreen");
  const message = document.getElementById("specialMessage");
  const secondLine = document.getElementById("secondLine");

  document.getElementById("mainCard").style.opacity = "0";

  setTimeout(() => {
    darkScreen.classList.add("active");
  }, 100);

  setTimeout(() => {
    message.classList.add("visible");
  }, 700);

  setTimeout(() => {
    darkScreen.classList.remove("active");
    document.body.classList.add("special");
    message.classList.add("warm");
  }, 2100);

  setTimeout(() => {
    secondLine.classList.add("visible");
  }, 3400);
}
</script>

</body>
</html>
